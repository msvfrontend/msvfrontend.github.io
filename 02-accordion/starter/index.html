<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Accordion — 3 способи</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>


<div class="page">


							<div class="accordion">
									<details class="accordion-item">
											<summary>
													Що таке HTML?
													<span class="icon">+</span>
											</summary>
											<div class="accordion-content">
													<p>
															HTML — це мова розмітки, яка визначає структуру вебсторінки.
													</p>
											</div>
									</details>
							</div>

							<div class="accordion">
									<div class="accordion-item checkbox-accordion">
											<input type="checkbox" id="css-question">
											<label for="css-question">
													Що таке CSS-селектор?
													<span class="icon">+</span>
											</label>
											<div class="accordion-content">
													<p>
															CSS-селектор визначає, до яких HTML-елементів потрібно застосувати стилі.
													</p>
											</div>
									</div>
							</div>

							<div class="accordion js-accordion">
									<div class="accordion-item">
											<div class="accordion-header">
													Як JavaScript знаходить елемент?
													<span class="icon">+</span>
											</div>
											<div class="accordion-content">
													<p>
															За допомогою DOM-методів, наприклад querySelector() та querySelectorAll().
													</p>
											</div>
									</div>
							</div>


</div>

    <script src="script.js"></script>

</body>
</html>
