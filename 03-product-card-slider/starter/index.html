<!DOCTYPE html>
<html lang="uk">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Каталог товарів</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="container">
		<header class="header">
			<h1>Каталог товарів</h1>
		</header>
		<div class="products-grid">

			<div class="product-card">

				<div class="badge-discount">-10%</div>

				<div class="image-rotator">
					<img src="./img/10245824_1.webp" alt="Осушувач повітря" class="main-image">

					<button class="rotator-btn rotator-prev" aria-label="Попереднє зображення">&#10094;</button>
					<button class="rotator-btn rotator-next" aria-label="Наступне зображення">&#10095;</button>
					
					<div class="rotator-controls">
						<span class="dot active" data-index="0"></span>
						<span class="dot" data-index="1"></span>
						<span class="dot" data-index="2"></span>
					</div>
				</div>

				<div class="product-code">Код: 10245824</div>
				<h3 class="product-title" title="Осушувач повітря Cooper&Hunter ComfoDry CH-D50FB">Осушувач повітря Cooper&Hunter ComfoDry CH-D50FB</h3>

				<div class="minicontainer">
					<div class="rating-stars">
						★★★★
						<span class="star">★</span>
					</div>
					<div class="availability">В наявності</div>
				</div>

				<div class="price-block">
					<div class="old-price">27000 ₴</div>
					<div class="current-price">24899 ₴</div>
				</div>

				<div class="specs">
					<div class="spec-row">
						<span class="spec-label">Бренд:</span>
						<span class="spec-value">Cooper&Hunter</span>
					</div>
					<div class="spec-row">
						<span class="spec-label">Модель:</span>
						<span class="spec-value">ComfoDry</span>
					</div>
				</div>

				<button class="buy-button">Купити</button>

			</div>

		</div>

	</div>
	
				<script src="script.js"></script>

</body>
</html>
